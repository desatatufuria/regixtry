services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: registry_auth
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "15432:5432"  
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dtf-netwok

  registry:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REGISTRY_AUTH_POSTGRES_DSN: postgres://registry:registry@postgres:5432/registry_auth?sslmode=disable
      REGISTRY_PUBLIC_URL: http://localhost:${REGISTRY_PORT:-5517}
    command:
      [
        "serve",
        "-addr",
        "0.0.0.0:5000",
        "-storage-root",
        "/var/lib/registry"
      ]
    ports:
      - "${REGISTRY_PORT:-5517}:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - dtf-netwok

volumes:
  postgres-data:
  registry-data:

networks:
  dtf-netwok:
    external: true
