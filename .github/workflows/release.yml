name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go test suite
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          amd64=(dist/registry_*_linux_amd64.tar.gz)
          arm64=(dist/registry_*_linux_arm64.tar.gz)
          checksums=(dist/registry_*_checksums.txt)

          if [ "${#amd64[@]}" -ne 1 ]; then
            echo "expected exactly one amd64 archive, found ${#amd64[@]}"
            exit 1
          fi

          if [ "${#arm64[@]}" -ne 1 ]; then
            echo "expected exactly one arm64 archive, found ${#arm64[@]}"
            exit 1
          fi

          if [ "${#checksums[@]}" -ne 1 ]; then
            echo "expected exactly one checksum file, found ${#checksums[@]}"
            exit 1
          fi

          grep -F "$(basename "${amd64[0]}")" "${checksums[0]}" >/dev/null
          grep -F "$(basename "${arm64[0]}")" "${checksums[0]}" >/dev/null

      - name: Run installer smoke verification
        shell: bash
        run: bash docs/verification/scripts/install-release-smoke.sh --release-dist dist
