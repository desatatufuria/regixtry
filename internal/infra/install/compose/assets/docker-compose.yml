# Canonical compose project for `regixtry setup --mode docker`. This file
# MUST stay byte-identical to internal/infra/install/compose/assets/docker-compose.yml,
# which is embedded into the regixtry binary via go:embed and enforced by a
# drift test, the same "cannot drift" rule the Dockerfile build stages
# already follow.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: regixtry_auth
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: ${REGIXTRY_POSTGRES_PASSWORD:?set it in .env (regixtry setup --mode docker generates one; manually: cp .env.example .env)}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d regixtry_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  regixtry:
    image: ${REGIXTRY_IMAGE:?set it in .env (e.g. ghcr.io/desatatufuria/regixtry:latest); manually: cp .env.example .env}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REGISTRY_AUTH_POSTGRES_DSN: ${REGIXTRY_AUTH_POSTGRES_DSN:?set it in .env (regixtry setup --mode docker generates one; manually: cp .env.example .env)}
      REGISTRY_PUBLIC_URL: http://localhost:${REGIXTRY_PORT:-5000}
    ports:
      - "${REGIXTRY_PORT:-5000}:5000"
    volumes:
      - registry-data:/var/lib/regixtry

volumes:
  postgres-data:
  registry-data:
