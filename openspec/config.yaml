schema: spec-driven

context: |
  Stack: Go application initialized; the repository contains a single-binary OCI registry, Bubble Tea operator console, and active OpenSpec artifacts under `openspec/changes/registry-foundation/`.
  Runtime: Docker-based development container with Go 1.26.x, Docker CLI/Compose, Node.js/npm, sqlite3, gopls, dlv, staticcheck, Air, and bootstrap tooling for opencode, codex, gentle-ai, and codegraph.
  Architecture: Implemented single Go binary with `serve` and `tui` entry modes, layered into application, domain, ports, protocol, infrastructure adapters, and TUI packages; filesystem blob storage and SQLite metadata back the current v1 runtime, while auth, tenant, and job seams remain explicit.
  Testing: Go module, package tests, protocol/integration tests, and local verification smoke scripts are present; no GitHub Actions workflow is currently checked into the repository.
  Style: English technical artifacts, minimalistic polished UX, low-resource design, GitFlow workflow, benchmark before implementation, clean commits.

strict_tdd: false

testing:
  detected: "2026-06-30"
  strict_tdd: false
  runner:
    available: true
    framework: "Go testing"
    command: "go test ./..."
  layers:
    unit:
      available: true
      tool: "Go testing table-driven package tests"
    integration:
      available: true
      tool: "httptest, temp dirs, disposable SQLite DB, and filesystem adapter tests"
    e2e:
      available: true
      tool: "docs/verification/scripts/docker-push-pull-smoke.sh and docs/verification/scripts/tui-smoke.sh"
  coverage:
    available: true
    command: "go test -cover ./..."
  quality:
    linter:
      available: true
      command: "go vet ./..."
    type_checker:
      available: true
      command: "go test ./... or go build ./..."
    formatter:
      available: true
      command: "gofmt -w ."

rules:
  proposal:
    - Include rollback plan for risky changes.
    - Benchmark existing OSS and industry registries before proposing implementation details.
    - Keep roadmap and documentation impact explicit from the start.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Distinguish current repository facts from planned product behavior.
  design:
    - Document architecture decisions with rationale and performance/resource tradeoffs.
    - Explain Docker API boundaries, registry storage model, and Bubble Tea TUI interaction model before implementation.
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
    - Separate benchmarking, documentation, platform bootstrap, and implementation tracks.
  apply:
    constraints:
      - Follow existing code patterns once they exist.
      - Keep commits clean and aligned with GitFlow.
    tdd: false
    test_command: "go test ./..."
  verify:
    constraints:
      - Prove benchmark assumptions, protocol behavior, and UX constraints against implementation artifacts.
      - Use the documented smoke scripts when validating Docker push/pull and TUI snapshot behavior.
    test_command: "go test ./..."
    build_command: "go build ./..."
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
