schema: spec-driven

context: |
  Stack: Single-binary Go 1.26 OCI registry with Bubble Tea TUI, filesystem blob storage, SQLite metadata, and optional PostgreSQL-backed auth/admin APIs.
  Runtime: `cmd/regixtry` exposes `serve`, `tui`, `bootstrap`, `bootstrap-admin`, `setup`, `uninstall`, and `upgrade`; release CI is defined in `.github/workflows/release.yml`.
  Architecture: Layered `internal/domain`, `internal/app`, `internal/ports`, `internal/infra`, `internal/protocol/http`, and `internal/tui`; current jobs remain inline with no persistent worker/queue.
  Testing: Go package tests cover domain, app, HTTP router, storage/auth adapters, TUI, and install lifecycle; smoke scripts validate installer, Docker push/pull, and TUI snapshot flows.
  OpenSpec: `openspec/` is already checked in with main specs (`installation-modes`, `lifecycle-cli`, `operator-admin-tui`) plus active and archived changes.
  Style: Technical artifacts stay in English; workflow expects strict TDD, hybrid SDD persistence, and clean reviewable changes.

strict_tdd: true

testing:
  detected: "2026-08-09"
  strict_tdd: true
  runner:
    available: true
    framework: "Go testing"
    command: "go test ./..."
  layers:
    unit:
      available: true
      tool: "Go testing package and table-driven tests"
    integration:
      available: true
      tool: "httptest, temp dirs, disposable SQLite/Postgres-backed adapter tests"
    e2e:
      available: true
      tool: "docs/verification/scripts/install-release-smoke.sh, docker-push-pull-smoke.sh, and tui-smoke.sh"
  coverage:
    available: true
    command: "go test -cover ./..."
  quality:
    linter:
      available: true
      command: "go vet ./..."
    type_checker:
      available: true
      command: "go build ./..."
    formatter:
      available: true
      command: "gofmt -w ."

rules:
  proposal:
    - Include rollback plan for risky changes.
    - Benchmark existing OSS and industry registries before proposing implementation details.
    - Keep roadmap and documentation impact explicit from the start.
    - Keep CI-first image scanning and later registry-driven rescans explicit when proposing supply-chain features.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Distinguish current repository facts from planned product behavior.
  design:
    - Document architecture decisions with rationale and performance/resource tradeoffs.
    - Explain Docker API boundaries, registry storage model, and Bubble Tea TUI interaction model before implementation.
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
    - Separate benchmarking, documentation, platform bootstrap, and implementation tracks.
  apply:
    constraints:
      - Follow existing code patterns once they exist.
      - Keep commits clean and aligned with GitFlow.
    tdd: true
    test_command: "go test ./..."
  verify:
    constraints:
      - Prove benchmark assumptions, protocol behavior, and UX constraints against implementation artifacts.
      - Use the documented smoke scripts when validating Docker push/pull and TUI snapshot behavior.
    test_command: "go test ./..."
    build_command: "go build ./..."
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
